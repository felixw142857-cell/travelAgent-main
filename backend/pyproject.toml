[project]
name = "travel-agent-backend"
version = "0.1.0"
description = "旅行规划助手的 FastAPI 服务端：模型、天气工具与多代理调度"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "tzdata>=2024.1",
    "uvicorn>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10.0",
    "ruff>=0.9,<1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
